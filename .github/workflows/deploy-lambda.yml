name: Build & Deploy to Lambda (Zip)
on:
  push:
    branches: [ main ]

env:
  APP_NAME: price-finder
  AWS_REGION: ${{ secrets.AWS_REGION }}
  LAMBDA_FUNCTION: price-finder
  LAMBDA_RUNTIME: python3.11
  LAMBDA_HANDLER: pricing.portal.handler
  LAMBDA_ZIP_PATH: lambda.zip

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4

      # 1) Configure AWS via OIDC
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 2) Build deployment ZIP package
      - name: Build Lambda ZIP package
        run: |
          set -e
          rm -rf package "$LAMBDA_ZIP_PATH"
          mkdir -p package
          python -m pip install -r requirements.txt -t package
          cp -r pricing package/
          (
            cd package
            zip -r "../$LAMBDA_ZIP_PATH" .
          )

      # 3) Create Lambda function if missing, else update code
      - name: Create or update Lambda function
        id: deploy
        run: |
          set -e

          if aws lambda get-function --function-name "$LAMBDA_FUNCTION" >/dev/null 2>&1; then
            echo "Updating existing Lambda code..."
            aws lambda update-function-code \
              --function-name "$LAMBDA_FUNCTION" \
              --zip-file "fileb://$LAMBDA_ZIP_PATH" >/dev/null
          else
            echo "Creating Lambda function..."
            aws lambda create-function \
              --function-name "$LAMBDA_FUNCTION" \
              --runtime "$LAMBDA_RUNTIME" \
              --handler "$LAMBDA_HANDLER" \
              --zip-file "fileb://$LAMBDA_ZIP_PATH" \
              --role "${{ secrets.AWS_LAMBDA_ROLE_ARN }}" \
              --timeout 60 \
              --memory-size 2048 >/dev/null
          fi

      # 6) (Optional) Update environment variables from GitHub secrets
      - name: Update Lambda environment variables
        run: |
          if [ -n "${{ secrets.BING_SUBSCRIPTION_KEY }}" ]; then
          echo "Setting BING_SUBSCRIPTION_KEY on Lambda…"
          aws lambda update-function-configuration \
            --function-name "$LAMBDA_FUNCTION" \
            --environment "Variables={BING_SUBSCRIPTION_KEY=${{ secrets.BING_SUBSCRIPTION_KEY }},PYTHONUNBUFFERED=1}"
          else
          echo "No BING_SUBSCRIPTION_KEY secret set; skipping."
          fi


      # 7) Output function ARN
      - name: Show Lambda details
        run: |
          aws lambda get-function --function-name "$LAMBDA_FUNCTION" --query 'Configuration.[FunctionArn,Runtime,Handler,PackageType]' --output table
